spring.application.name=webpay

server.port=9696

#MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:file:/data/demo
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.connection-timeout=18000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.max-lifetime=10000
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.datasource.hikari.validationTimeout=18000
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jackson.time-zone=Africa/Lagos
management.endpoint.metrics.enabled= true
spring.jmx.enabled= false


#INTERSWITCH WEBPAY
ISW_PURCHASEURL=https://qa.interswitchng.com/api/v3/purchases
ISW_AUTHVERIFYURL=https://qa.interswitchng.com/api/v3/purchases/otps/auths
ISW_AUTHURL=https://apps.qa.interswitchng.com/passport/oauth/token?grant_type=client_credentials
ISW_STATUSCHECKURL=https://qa.interswitchng.com/collections/api/v1/gettransaction.json?merchantcode=MX165929&transactionreference=
ISW_RESENDOTPURL=https://qa.interswitchng.com/api/v3/purchases/otps/resend
ISW_BASICAUTH=
ISW_USERNAME=
ISW_PASSWORD=
ISW_CLIENTID=
ISW_SECRETKEY=
MERCHANT_CODE=
PAYMENT_ITEM_ID=
ISW_
ISW_PUBLIC_EXPONENT=010001
logging.level.web=DEBUG
spring.mvc.log-request-details=true


#LOGGING
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
spring.output.ansi.enabled=detect
logging.logback.rollingpolicy.max-file-size=10MB
logging.file.path=${user.home}/webpaylogs


#API DOC
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
